<!-- Contact Form -->
<div class="container3">
    <div class="container">
        <div id="contactform">
            <form id="contactForm" class="form-horizontal" role="form">
                <div class="form-group">
                    <label for="inputMessage" class="col-lg-2 control-label">Bericht</label>
                    <div class="col-lg-10">
                        <textarea class="form-control" rows="3" id="inputMessage" name="inputMessage"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-lg-offset-2 col-lg-10">
                        <button type="submit" class="btn btn-default">Verstuur</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Handle form submission
    document.getElementById('contactForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const message = document.getElementById('inputMessage').value.trim();
        const subject = encodeURIComponent('Bericht via irisligtenberg.nl');
        const body = encodeURIComponent(message);
        window.location.href = `mailto:webmaster@irisligtenberg.nl?subject=${subject}&body=${body}`;
    });
</script>
